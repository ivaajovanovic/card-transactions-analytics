server.port=9050
spring.application.name=columnar-database-service

# Cassandra
spring.data.cassandra.contact-points=localhost
spring.data.cassandra.keyspace-name=nais
spring.data.cassandra.port=9042
spring.data.cassandra.local-datacenter=datacenter1      # DODAJ OVO
spring.data.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# (ako koristiš auth, dodaj)
# spring.data.cassandra.username=cassandra
# spring.data.cassandra.password=cassandra

# Redis (ostaje kako jeste, ako ga koristiš za idempotenciju)
redis.host=localhost
redis.port=6379

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.healthcheck.enabled=true                  # ISPRAVKA KLJUČA
eureka.instance.prefer-ip-address=true
