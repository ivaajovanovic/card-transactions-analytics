# =========================
# Service
# =========================
server.port=9050
spring.application.name=columnar-database-service

# =========================
# Cassandra
# =========================
spring.data.cassandra.contact-points=localhost
spring.data.cassandra.port=9042
spring.data.cassandra.keyspace-name=nais
spring.data.cassandra.local-datacenter=datacenter1
spring.data.cassandra.schema-action=CREATE_IF_NOT_EXISTS
# Ako je uključen auth na Cassandri, odkomentariši:
# spring.data.cassandra.username=cassandra
# spring.data.cassandra.password=cassandra

# Dev: inicijalizuj šemu sa classpath:db/cql/schema.cql (SchemaInitializer)
# U produkciji postavi na false ili ukloni.
app.schema.init=true

# =========================
# Eureka (service discovery)
# =========================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true

# =========================
# Actuator (health za Eureku)
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# Redis (opciono; zadržano radi kompatibilnosti)
# (Naš dedup koristi LWT tabelu, ne Redis. Ovo može i da ostane neiskorišćeno.)
# =========================
redis.host=localhost
redis.port=6379

# =========================
# Logging (opciono)
# =========================
logging.level.org.springframework.data.cassandra=INFO
logging.level.com.datastax.oss.driver=INFO


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
